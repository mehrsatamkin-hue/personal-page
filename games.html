<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بازی‌های مهسا — پرش جوجه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#20202b;--cream:#fff8e8;--pink:#ff7f9f;--yellow:#ffd35a;--blue:#99dff5;--green:#75c98b}*{box-sizing:border-box;margin:0}body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:Vazirmatn,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#ffb8c6 1px,transparent 1px);background-size:18px 18px}.wrap{width:min(1040px,calc(100% - 32px));margin:auto;position:relative;z-index:1}nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.logo{font:500 17px 'DM Mono',monospace;direction:ltr}.logo b{color:#f1577e}.back{font-size:13px;color:#787381}.back:hover{color:#f1577e}.intro{text-align:center;padding:18px 0 24px}.kicker{color:#e65e80;font:500 13px 'DM Mono',monospace;direction:ltr}.intro h1{font-size:clamp(34px,6vw,64px);line-height:1.2;margin:8px 0}.intro h1 span{color:#f1577e}.intro p{color:#777181}.game-card{background:#fff;border:3px solid var(--ink);border-radius:28px;padding:16px;box-shadow:8px 9px 0 var(--ink);max-width:900px;margin:0 auto}.hud{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 15px;font-size:14px}.hud strong{font:500 18px 'DM Mono',monospace;direction:ltr}.lives{color:#f1577e;letter-spacing:3px}.stage{color:#7c7a86}.game{height:380px;position:relative;overflow:hidden;border-radius:17px;background:linear-gradient(#a9e8f8 0 67%,#8fd494 67% 100%);cursor:pointer;touch-action:manipulation}.cloud{position:absolute;width:120px;height:35px;border-radius:30px;background:rgba(255,255,255,.75);top:52px;right:12%;box-shadow:-45px 11px 0 -7px rgba(255,255,255,.75),30px 10px 0 -4px rgba(255,255,255,.75);animation:drift 12s linear infinite}.cloud.two{top:120px;right:auto;left:10%;transform:scale(.65);animation-duration:17s;animation-direction:reverse;opacity:.55}.sun{position:absolute;top:28px;left:10%;width:64px;height:64px;background:var(--yellow);border-radius:50%;box-shadow:0 0 0 12px rgba(255,211,90,.18)}.ground{position:absolute;bottom:0;left:0;right:0;height:12px;background:#52a968}.finish{position:absolute;bottom:12px;right:18px;width:8px;height:176px;background:var(--ink);z-index:2}.finish:before{content:'🏁';position:absolute;top:-16px;right:0;font-size:39px}.finish:after{content:'مرحله آخر';position:absolute;white-space:nowrap;top:29px;right:17px;background:#fff;padding:3px 8px;border-radius:8px;font-size:11px}.chicken{position:absolute;z-index:4;bottom:12px;left:82px;width:64px;height:64px;background:#fffdf5;border:3px solid var(--ink);border-radius:50% 50% 42% 42%;transition:transform .08s}.chicken:before{content:'🐥';position:absolute;font-size:47px;top:0;left:5px;line-height:1}.chicken:after{content:'';position:absolute;right:-14px;top:26px;border-width:7px 0 7px 15px;border-style:solid;border-color:transparent transparent transparent #f09a43}.wing{position:absolute;width:20px;height:13px;background:#f9d957;border:2px solid var(--ink);border-radius:50%;left:8px;top:35px;z-index:5}.obstacle{position:absolute;bottom:12px;width:36px;height:51px;background:#f18b54;border:3px solid var(--ink);border-radius:8px 8px 4px 4px;z-index:3}.obstacle:before{content:'';position:absolute;top:-13px;left:4px;width:22px;height:13px;background:#f18b54;border:3px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0}.o1{right:29%;}.o2{right:52%;height:67px;background:#c584e8}.o2:before{background:#c584e8}.o3{right:73%;height:43px;background:#5fb9d0}.o3:before{background:#5fb9d0}.hint{text-align:center;color:#777181;font-size:12px;padding:15px 0 2px}.overlay{position:absolute;inset:0;background:rgba(32,32,43,.78);display:grid;place-items:center;text-align:center;color:#fff;z-index:9}.overlay.hidden{display:none}.modal{background:var(--cream);color:var(--ink);padding:28px;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--pink);max-width:300px}.modal h2{font-size:25px}.modal p{margin:7px 0 18px;color:#6e6975;font-size:14px}.button{border:0;background:var(--pink);color:#fff;font:600 15px Vazirmatn;padding:10px 22px;border-radius:10px;cursor:pointer}.button:hover{background:#ef5d82}.footer{text-align:center;padding:30px 0;color:#8b8590;font-size:12px}@keyframes drift{from{transform:translateX(40px)}to{transform:translateX(-120px)}}@media(max-width:600px){.game{height:300px}.chicken{left:45px;transform:scale(.85);transform-origin:bottom}.o1{right:28%}.o2{right:53%}.o3{right:75%}.finish{height:125px}.hud{font-size:12px}.hud strong{font-size:15px}}
  </style>
  <style>
    .o1 { right: 18%; }
    .o2 { right: 40%; height: 55px; }
    .o3 { right: 60%; height: 34px; }
    @media (max-width: 600px) {
      .o1 { right: 14%; }
      .o2 { right: 32%; }
      .o3 { right: 50%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav><a class="logo" href="index.html">mehrsa<b>.</b>dev</a><a class="back" href="index.html">بازگشت به صفحه اصلی ↩</a></nav>
    <header class="intro"><div class="kicker">MEHRSA'S MINI GAMES</div><h1>بازی‌های <span>مهرسا</span></h1><p>جوجه کوچولو را به خط پایان برسان!</p></header>
    <main class="game-card"><div class="hud"><div>امتیاز <strong id="score">۰۰۰</strong></div><div class="stage" id="stage">مرحله ۱ از ۳</div><div class="lives" id="lives">♥ ♥ ♥ ♥ ♥</div></div><div class="game" id="game" role="application" aria-label="بازی پرش جوجه"><div class="sun"></div><div class="cloud"></div><div class="cloud two"></div><div class="ground"></div><div class="finish"></div><div class="obstacle o1"></div><div class="obstacle o2"></div><div class="obstacle o3"></div><div class="chicken" id="chicken"><i class="wing"></i></div><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">پرش جوجه</h2><p id="modalText">برای پرش، روی صفحه بزن یا کلید Space را فشار بده.</p><button class="button" id="start">شروع بازی</button></div></div></div><div class="hint">پرش: Space / ↑ / لمس صفحه &nbsp; • &nbsp; با ۳ مرحله‌ی کوتاه به پرچم برس</div></main>
    <div class="footer">ساخته شده با کنجکاوی و شکلات 🍫</div>
  </div>
  <script>
    const game=document.querySelector('#game'),chicken=document.querySelector('#chicken'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),stageEl=document.querySelector('#stage'),title=document.querySelector('#modalTitle'),text=document.querySelector('#modalText');
    let jumping=false,playing=false,score=0,lives=5,stage=1,raf,startedAt,invulnerableUntil=0;
    const jump=()=>{if(!playing||jumping)return;jumping=true;let t=0;const animate=()=>{t+=.09;const y=Math.sin(t*Math.PI)*175;chicken.style.transform=`translateY(${-y}px)`;if(t<1)requestAnimationFrame(animate);else{chicken.style.transform='';jumping=false}};requestAnimationFrame(animate)};
    const collision=()=>{const c=chicken.getBoundingClientRect();return [...document.querySelectorAll('.obstacle')].some(o=>{const r=o.getBoundingClientRect();return c.left+18<r.right&&c.right-18>r.left&&c.bottom-16>r.top&&c.top<r.bottom})};
    const loop=()=>{if(!playing)return;if(Date.now()>=invulnerableUntil&&collision()){lives--;invulnerableUntil=Date.now()+1200;livesEl.textContent='♥ '.repeat(lives)+'♡ '.repeat(5-lives);chicken.style.left='';if(!lives)return end(false);playing=false;setTimeout(()=>{playing=true;raf=requestAnimationFrame(loop)},700);return}score=Math.min(120,Math.floor((Date.now()-startedAt)/100));scoreEl.textContent=String(score).padStart(3,'0');const nextStage=score>=80?3:score>=40?2:1;if(nextStage!==stage){stage=nextStage;stageEl.textContent=`مرحله ${stage} از ۳`}if(score>=120)return end(true);raf=requestAnimationFrame(loop)};
    const end=won=>{playing=false;cancelAnimationFrame(raf);title.textContent=won?'🎉 بردی!':'اوه نه!';text.textContent=won?'جوجه به پرچم رسید و هر سه مرحله را کامل کرد.':'موانع کمی سخت بودند؛ دوباره امتحان کن!';start.textContent=won?'بازی دوباره':'تلاش دوباره';overlay.classList.remove('hidden')};
    const begin=()=>{score=0;lives=5;stage=1;playing=true;jumping=false;invulnerableUntil=0;scoreEl.textContent='۰۰۰';livesEl.textContent='♥ ♥ ♥ ♥ ♥';stageEl.textContent='مرحله ۱ از ۳';overlay.classList.add('hidden');startedAt=Date.now();raf=requestAnimationFrame(loop)};start.addEventListener('click',begin);game.addEventListener('pointerdown',e=>{if(e.target!==start)jump()});document.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();if(!playing)begin();else jump()}});
  </script>
</body>
</html>
